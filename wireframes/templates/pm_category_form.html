<!DOCTYPE html>
<html>
<head>
    <title>{{ mode }} Category - Platform Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #fff; }
        .header { background-color: #e0e0e0; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        nav { background: #fff; border-bottom: 2px solid #000; padding: 0 20px; }
        nav a { text-decoration: none; color: black; padding: 15px; display: inline-block; font-weight: bold; }
        nav a.active { border-bottom: 4px solid black; }
        .content { padding: 30px; max-width: 800px; }
        .content h3 { font-size: 22px; font-weight: bold; margin-bottom: 16px; }
        .form-group { display: flex; margin-bottom: 20px; align-items: flex-start; }
        .form-group label { width: 200px; font-weight: bold; padding-top: 10px; }
        .form-group input, .form-group textarea { flex: 1; padding: 10px; border: 1px solid black; font-family: Arial; font-size: 14px; }
        .form-group textarea { height: 120px; resize: vertical; }
        hr { border: none; border-top: 1px solid #000; margin: 24px 0; }
        .btn-group { margin-left: 200px; }
        .btn-black { background: black; color: white; padding: 10px 30px; cursor: pointer; border: none; font-weight: bold; text-transform: uppercase; }
        .btn-cancel { background: white; color: black; padding: 10px 30px; border: 1px solid black; text-decoration: none; margin-left: 10px; font-weight: bold; display: inline-block; }
        .error { color: #c62828; background-color: #fdecea; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body onload="loadCategoryData()">

    <div class="header">
        <h2>Online Fundraising System</h2>
        <div>Welcome, {{ session['username'] }} | <a href="{{ url_for('auth.logout') }}">Logout</a></div>
    </div>

    <nav>
        <a href="{{ url_for('auth.pm_categories') }}" class="active">Categories</a>
        <a href="{{ url_for('auth.pm_reports') }}">Reports</a>
    </nav>

    <div class="content">
        <h3>{{ mode }} Category</h3>
        <hr>

        <div class="error" id="errorBox" style="display: none;">
            ⚠️ Error: "Category name already exists."
        </div>

        <form id="categoryForm">
            <div class="form-group">
                <label>Category Name:</label>
                <input type="text" id="cat_name" required>
            </div>

            <div class="form-group">
                <label>Description:</label>
                <textarea id="cat_desc"></textarea>
            </div>

            <hr>

            <div class="btn-group">
                <button type="button" class="btn-black" onclick="simulateSubmit()">
                    {{ 'UPDATE' if mode == 'Update' else 'SUBMIT' }}
                </button>
                <a href="{{ url_for('auth.pm_categories') }}" class="btn-cancel">CANCEL</a>
            </div>
        </form>
    </div>

    <script>
        const categoryData = {
            'medical': { name: 'Medical', desc: 'Funding healthcare services, hospital treatments, and patient support programs' },
            'education': { name: 'Education', desc: 'Providing resources for school supplies, tuition assistance, and learning initiatives' },
            'environment': { name: 'Environment', desc: 'Supporting climate action, conservation projects, and wildlife protection efforts' }
        };

        function loadCategoryData() {
            const isUpdate = "{{ mode }}" === "Update";
            if (isUpdate) {
                const urlParams = new URLSearchParams(window.location.search);
                const catKey = urlParams.get('cat');
                
                if (catKey && categoryData[catKey]) {
                    document.getElementById('cat_name').value = categoryData[catKey].name;
                    document.getElementById('cat_desc').value = categoryData[catKey].desc;
                }
            }
        }

        function simulateSubmit() {
            const inputName = document.getElementById('cat_name').value.trim().toLowerCase();
            const isUpdate = "{{ mode }}" === "Update";
            const urlParams = new URLSearchParams(window.location.search);
            const currentCatKey = urlParams.get('cat');

            let isDuplicate = false;

            for (let key in categoryData) {
                if (categoryData[key].name.toLowerCase() === inputName) {
                    if (!isUpdate || (isUpdate && key !== currentCatKey)) {
                        isDuplicate = true;
                        break;
                    }
                }
            }

            if (isDuplicate) {
                document.getElementById('errorBox').style.display = 'flex';
                window.scrollTo(0, 0);
            } else {
                const type = isUpdate ? 'update' : 'create';
                window.location.href = "{{ url_for('auth.pm_categories') }}?success=true&type=" + type;
            }
        }
    </script>
</body>
</html>
