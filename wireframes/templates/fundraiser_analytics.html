<!DOCTYPE html>
<html>
<head>
    <title>Activity Analytics</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #fff; }
        .header { background: #e0e0e0; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        nav { background: #fff; border-bottom: 2px solid #000; padding: 0 20px; }
        nav a { text-decoration: none; color: black; padding: 15px; display: inline-block; font-weight: bold; }
        nav a.active { border-bottom: 4px solid black; }
        .content { padding: 30px; }
        .stats-container { display: flex; gap: 20px; margin-top: 30px; }
        .stat-card { border: 1px solid black; width: 300px; text-align: center; }
        .stat-title { background: black; color: white; padding: 10px; font-weight: bold; }
        .stat-value { font-size: 48px; font-weight: bold; padding: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Online Fundraising System</h2>
        <div>Welcome, {{ session['username'] }} | <a href="{{ url_for('auth.logout') }}">Logout</a></div>
    </div>
    <nav>
        <a href="{{ url_for('auth.fundraiser_activities') }}">My Activities</a>
        <a href="{{ url_for('auth.fundraiser_history') }}">History</a>
        <a href="{{ url_for('auth.fundraiser_analytics') }}" class="active">Analytics</a>
    </nav>
    <div class="content">
        <h3>Activity Analytics</h3>
        <p>Select Activity: 
            <select id="activitySelector" style="padding: 10px; width: 300px;">
                <!-- Empty placeholder option -->
                <option value="" disabled selected>-- Choose an activity --</option>
                <option value="forests">Save the Forests</option>
                <option value="water">Clean Water Project</option>
            </select>
        </p>
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-title">TOTAL VIEWS</div>
                <!-- Initial state set to 0 -->
                <div id="totalViews" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">TOTAL FAVOURITES</div>
                <div id="totalFavourites" class="stat-value">0</div>
            </div>
        </div>
    </div>

    <script>
        const projectData = {
            "forests": {
                "views": "1,240",
                "favourites": "152"
            },
            "water": {
                "views": "890",
                "favourites": "64"
            }
        };

        const selector = document.getElementById('activitySelector');
        const viewDisplay = document.getElementById('totalViews');
        const favDisplay = document.getElementById('totalFavourites');

        selector.addEventListener('change', function() {
            const selectedProject = projectData[this.value];
            if (selectedProject) {
                viewDisplay.textContent = selectedProject.views;
                favDisplay.textContent = selectedProject.favourites;
            }
        });
    </script>
</body>
</html>
